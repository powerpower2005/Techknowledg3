site_name: Techknowledg3
site_description: CS 면접 준비와 기술 지식 위키 · 질문, 주제와 태그로 탐색하는 학습 노트
site_url: https://powerpower2005.github.io/Techknowledg3/
repo_url: https://github.com/powerpower2005/Techknowledg3
repo_name: powerpower2005/Techknowledg3
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
dev_addr: 127.0.0.1:8001
use_directory_urls: true
theme:
  name: material
  language: ko
  font: false
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로 전환
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로 전환
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
plugins:
  - search:
      lang: [en]
  - tags:
      tags_slugify_format: "{slug}"
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - assets/stylesheets/extra.css
extra:
  publication_scope: public
  status:
    draft: 작성 중인 초안
    review: 기술 설명 검토 필요
    note: 학습 및 운영 기록
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
